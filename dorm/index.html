<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1f2a2e;--mut:#6b7478;--line:#e5e1d8;--pri:#0f766e;--pri2:#e3f2ef;--warn:#b45309;--warn2:#fdf1e3;--bad:#b91c1c;--bad2:#fdeaea;--ok:#15803d;--ok2:#e7f5ec}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:86px;font-size:15px;line-height:1.5}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dorm{font-weight:700;font-size:17px}.sub{font-size:12px;opacity:.85}
header select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 8px;font:inherit;font-size:14px}
header select option{color:#000}
main{padding:14px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.h{font-weight:700;font-size:16px}.mut{color:var(--mut)}.sm{font-size:13px}.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .l{font-size:12px;color:var(--mut)}.stat .v{font-size:19px;font-weight:700}
.stat.ok{background:var(--ok2);border-color:#cfe9d7}.stat.bad{background:var(--bad2);border-color:#f5cccc}.stat.pri{background:var(--pri2);border-color:#c9e6e0}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.rno{font-weight:700;font-size:17px;min-width:52px}
.grow{flex:1;min-width:0}.right{text-align:right}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.bad{background:var(--bad2);color:var(--bad)}.chip.mut{background:#efede8;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
.btn.bad{color:var(--bad);border-color:#f0c4c4}
.btn.block{display:flex;width:100%;margin-top:10px}.btn.big{padding:13px;font-size:16px}
.btn.sm{padding:6px 10px;font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,textarea,select.f{display:block;width:100%;margin-top:4px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
input:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
textarea{min-height:90px;font-size:12px;font-family:monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.mhead{display:flex;justify-content:space-between;align-items:baseline}
.mres{margin-top:8px;font-size:13px;background:#faf9f6;border-radius:9px;padding:7px 9px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{background:none;border:0;font:inherit;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;cursor:pointer}
nav.tabs button span{font-size:20px;filter:grayscale(1);opacity:.6}

.neg{color:var(--bad)}.pos{color:var(--ok)}

/* ===== plain ledger theme ===== */
:root{--bg:#f6f4ef;--card:#fff;--ink:#22211e;--mut:#6e695f;--line:#e3ded3;--pri:#2f5d50;--pri2:#e9f0eb;--warn:#8a5a12;--warn2:#fbf3e4;--bad:#a63a2a;--bad2:#f8ebe7;--ok:#3a6b38;--ok2:#ecf3ea}
body{font-family:'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);font-variant-numeric:tabular-nums}
header.top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none;padding:12px 16px}
.dorm{font-size:18px;text-shadow:none;letter-spacing:0}
.sub{color:var(--mut);opacity:1}
header select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:none;backdrop-filter:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:none;padding:16px}
.h{font-size:16px;font-weight:600}
.stats{gap:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat,.stat.ok,.stat.bad,.stat.pri{background:none;border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;padding:10px 12px}
.stat:first-child{border-left:0}
.stat .v{font-weight:600}
.stat.pri .v{color:var(--pri)}.stat.ok .v{color:var(--ok)}.stat.bad .v{color:var(--bad)}
.card .stats{border-radius:6px}
.rno{background:none;box-shadow:none;border-radius:0;padding:0;color:var(--ink);font-weight:600;text-align:left;min-width:48px;font-size:16px}
.item{border-radius:0;margin:0;padding:12px 0}
.item:hover{background:#faf9f5}
.chip,.chip.ok,.chip.bad,.chip.mut,.chip.warn{background:none;box-shadow:none;padding:0;border-radius:0;font-weight:500}
.chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.mut{color:var(--mut)}
.btn{border:1px solid #cfc8bb;background:var(--card);border-radius:6px;box-shadow:none;margin-bottom:0;transition:background .12s;font-weight:500}
.btn:hover{background:#f3f0e9;filter:none}
.btn:active{transform:none;box-shadow:none;background:#ebe7de}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;text-shadow:none;box-shadow:none}
.btn.pri:hover{background:#264d42}
.btn.line{background:#06c755;border-color:#06c755;color:#fff;text-shadow:none;box-shadow:none}
.btn.line:hover{background:#05b04b}
.btn.bad{background:var(--card);border-color:#e2c3bc;color:var(--bad);box-shadow:none}
.btn.big{font-size:15.5px;padding:12px}
input,textarea,select.f{border:1px solid #d6d0c4;border-radius:6px;background:#fff;box-shadow:none}
input:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,93,80,.15)}
.sec{font-weight:600;margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.pills{gap:0;border:1px solid #d6d0c4;border-radius:6px;overflow:hidden;display:inline-flex;flex-wrap:wrap}
.pill{background:#fff;border:0;border-left:1px solid #d6d0c4;border-radius:0;box-shadow:none;padding:8px 12px;font-weight:500}
.pill:first-child{border-left:0}
.pill.on{background:var(--pri);color:#fff;box-shadow:none;border-color:#d6d0c4}
.pill:active{transform:none;box-shadow:none}
.paylog .pill{border:1px solid #d6d0c4;border-radius:6px}
.banner{background:var(--pri2);border:0;border-left:3px solid var(--pri);border-radius:0 6px 6px 0;box-shadow:none}
.hint{background:var(--warn2);border-left:3px solid #d9a441;border-radius:0 6px 6px 0;box-shadow:none}
.mres{background:#f8f6f1;box-shadow:none;border-radius:6px}
.paidbox{background:var(--ok2);box-shadow:none;border-radius:6px}
.qr{border:1px solid var(--line);border-radius:8px;box-shadow:none}
.poster{background:#fff;border:1px solid var(--ink);border-radius:4px;box-shadow:none}
.poster .big{color:var(--ink);font-size:26px}
.doc{border-radius:6px}
table.bill tr.tot td{color:var(--ink);border-top:2px solid var(--ink);padding-top:10px}
nav.tabs{background:var(--card);backdrop-filter:none;border-top:1px solid var(--line);box-shadow:none}
nav.tabs button{color:var(--mut);font-size:11.5px;gap:3px;position:relative}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs button.on{color:var(--pri);font-weight:600}
nav.tabs button.on::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:2px;background:var(--pri)}
.modal{background:rgba(30,28,24,.45);backdrop-filter:none}
.sheet{background:var(--card);border-radius:12px 12px 0 0;box-shadow:none}
.x{background:#f1eee8;border:0;box-shadow:none;border-radius:6px;width:32px;height:32px;font-size:15px;color:var(--mut)}
.x:active{transform:none}
#toast{background:var(--ink);border-radius:6px;box-shadow:none}
@media(min-width:900px){
  header.top{padding:14px 24px}
  nav.tabs{box-shadow:none;border-right:1px solid var(--line);border-top:0;padding-top:76px}
  nav.tabs button{border-radius:6px;font-size:15px}
  nav.tabs button.on{background:var(--pri2)}
  nav.tabs button.on::before{display:none}
  nav.tabs button:hover{background:#f3f0e9}
  .sheet{border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
}
/* ---- v2 ---- */
.rmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;cursor:pointer;background:#fff;font-size:12px;line-height:1.3}
.tile b{display:block;font-size:15px}
.tile.paid{background:var(--ok2);border-color:#c8dcc4;color:var(--ok)}
.tile.due{background:var(--bad2);border-color:#e6c4bc;color:var(--bad)}
.tile.wait{background:#fff;color:var(--ink)}
.tile.empty{background:#f1eee8;color:var(--mut);border-style:dashed}
.tile.resv{background:#eaf0f6;border-color:#c6d4e3;color:#2b5d8a}
.tile.fix{background:var(--warn2);border-color:#ecd5ad;color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.ph-btn{position:relative;overflow:hidden}
.ph-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.check{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:13px}
.check input{width:20px;height:20px;margin:0;flex:none}
.bar2{height:8px;background:#ebe7de;border-radius:99px;overflow:hidden;margin-top:6px}.bar2 i{display:block;height:100%;background:var(--pri)}
main{padding-bottom:70px}
.fab{position:fixed;right:14px;bottom:84px;z-index:8;background:var(--pri);color:#fff;border:0;border-radius:99px;padding:11px 16px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media(min-width:900px){.fab{bottom:24px;right:24px}}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px}
.msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-line}
.msg.bot{background:#f3f0e9;align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--pri);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips button{border:1px solid #d6d0c4;background:#fff;border-radius:99px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chatin{display:flex;gap:8px;margin-top:10px}.chatin input{margin:0}
/* ===== JOE tactile theme ===== */
:root{--bg:#ede6d8;--card:#fffdf8;--ink:#1f2a24;--mut:#6f6858;--line:#e4dac7;--pri:#2c5e4f;--pri2:#e4efe8;--brass:#b98a3e;--lip:#d8cdb6}
body{background:linear-gradient(180deg,#f3eee4 0,#e9e1d1 100%) fixed;color:var(--ink)}
header.top{background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 0 #fff inset,0 8px 18px -14px rgba(60,45,20,.45)}
.dorm{font-weight:700;letter-spacing:.1px}
.dorm::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--brass);margin-right:8px;vertical-align:1px;box-shadow:0 2px 0 #8d6627}
header select{background:linear-gradient(#fffefb,#f3ede1);border:1px solid #d9cfbc;border-radius:9px;box-shadow:0 2px 0 var(--lip),inset 0 1px 0 #fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 #fff,0 2px 0 var(--lip),0 10px 22px -16px rgba(60,45,20,.45)}
.stats{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 #fff,0 2px 0 var(--lip),0 10px 22px -16px rgba(60,45,20,.45)}
.card .stats{box-shadow:inset 0 2px 4px rgba(60,45,20,.07);background:#faf6ee;border-radius:10px}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.3px}
.stat .l{letter-spacing:.2px}
.btn{background:linear-gradient(180deg,#fffefb,#f1eadc);border:1px solid #d6cbb5;border-radius:10px;box-shadow:inset 0 1px 0 #fff,0 2px 0 var(--lip),0 6px 12px -8px rgba(60,45,20,.45);transition:transform .06s,box-shadow .06s;font-weight:600}
.btn:hover{background:linear-gradient(180deg,#fff,#f4eee2)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 2px rgba(60,45,20,.15),0 0 0 var(--lip)}

.btn.pri:hover{background:linear-gradient(180deg,#418470,#2f6454)}

.tile:active{transform:translateY(3px);box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.tile.paid{background:linear-gradient(180deg,#f2f9f1,#dcecd8);border-color:#bcd6b6;box-shadow:inset 0 1px 0 #fff,0 3px 0 #a9c7a2,0 8px 12px -10px rgba(40,90,40,.5)}
.tile.due{background:linear-gradient(180deg,#fff5f2,#f6dcd5);border-color:#e6bfb5;box-shadow:inset 0 1px 0 #fff,0 3px 0 #d9aa9e,0 8px 12px -10px rgba(140,50,30,.5)}
.tile.empty{background:#ebe5d8;border-style:dashed;box-shadow:inset 0 2px 4px rgba(60,45,20,.1)}

.pills{border:1px solid #d6cbb5;border-radius:10px;background:#f1eadc;padding:3px;gap:3px;box-shadow:inset 0 2px 3px rgba(60,45,20,.1)}

.pill.on{background:linear-gradient(180deg,#3b7a66,#2c5e4f);color:#fff;box-shadow:0 2px 0 #1b3f34}

.sec{border-top:1px dashed var(--line)}
nav.tabs{background:rgba(255,253,248,.97);border-top:1px solid var(--line);box-shadow:0 -10px 24px -18px rgba(60,45,20,.55)}
nav.tabs button.on::before{display:none}
nav.tabs button svg{padding:4px 10px;width:44px;height:30px;border-radius:10px;box-sizing:border-box}
nav.tabs button.on svg{background:linear-gradient(180deg,#3b7a66,#2c5e4f);color:#fff;stroke:#fff;box-shadow:0 2px 0 #1b3f34}

.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:#ddd3c0;margin:-6px auto 12px;box-shadow:inset 0 1px 1px rgba(0,0,0,.08)}
.modal{background:rgba(35,30,20,.42)}
.x{background:linear-gradient(180deg,#fffefb,#efe7d7);border:1px solid #ddd2bd;box-shadow:0 2px 0 var(--lip);border-radius:9px}
.x:active{transform:translateY(2px);box-shadow:none}
.fab{background:linear-gradient(180deg,#c99a4b,#b0823a);border:1px solid #946b2a;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #7d5a22,0 10px 18px -8px rgba(110,80,30,.7);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.fab:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
.msg.bot{background:#f3ede1;box-shadow:inset 0 1px 0 #fff,0 1px 0 var(--lip)}
.msg.me{background:linear-gradient(180deg,#3b7a66,#2c5e4f);box-shadow:0 2px 0 #1b3f34}

.qr,.poster{border-radius:14px;box-shadow:inset 0 1px 0 #fff,0 2px 0 var(--lip),0 10px 22px -16px rgba(60,45,20,.45)}

.bar2{box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}.bar2 i{background:linear-gradient(90deg,#3b7a66,#2c5e4f)}
#toast{border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
@media(min-width:900px){nav.tabs{background:var(--card);box-shadow:8px 0 24px -18px rgba(60,45,20,.5)}nav.tabs button.on{background:var(--pri2)}nav.tabs button svg{padding:0;width:22px;height:22px;background:none!important;box-shadow:none!important;stroke:currentColor!important}.sheet{border-radius:16px}.sheet::before{display:none}}
@media print{header,nav,.noprint,.fab{display:none!important}.modal{position:static;background:none}.sheet{max-height:none;box-shadow:none}.doc{max-height:none;border:0;background:none}body{padding:0}main{display:none}}

<body>
<header class="top">
  <div><div class="dorm" id="dormName"></div><div class="sub" id="topSub"></div></div>
  <select id="monthSel" aria-label="เลือกเดือน"></select>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>หน้าหลัก</button>
  <button data-t="meter" onclick="go('meter')"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4"/><path d="M9 17.5h6"/></svg>จดมิเตอร์</button>
  <button data-t="bills" onclick="go('bills')"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>บิล</button>
  <button data-t="rooms" onclick="go('rooms')"><svg viewBox="0 0 24 24"><path d="M6 21V4h12v17"/><path d="M3 21h18"/><path d="M14.5 12h.5"/></svg>ห้อง</button>
  <button data-t="money" onclick="go('money')"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>บัญชี</button>
  <button data-t="settings" onclick="go('settings')"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>ตั้งค่า</button>
</nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<button class="fab noprint" id="fab" onclick="openBot()">💬 ถามน้องโจ้</button>

<script>
const LS='dorm_app_v1';
const TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const pad=n=>String(n).padStart(2,'0');
const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const monthLabel=k=>{const[y,m]=k.split('-');return TH_M[m-1]+' '+(+y+543)};
const prevKey=k=>{let[y,m]=k.split('-').map(Number);m--;if(!m){m=12;y--}return y+'-'+pad(m)};
const nextKey=k=>{let[y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+pad(m)};
const r2=n=>Math.round((+n||0)*100)/100;
const baht=n=>r2(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return (+d)+' '+TH_M[m-1].slice(0,3)+'. '+(+y+543)};
const uid=()=>'r'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);

let S, storageOK=true, tab='home', cur=monthKey(new Date());

function load(){
  try{const raw=localStorage.getItem(LS);if(raw){S=JSON.parse(raw);fixS();return}}catch(e){storageOK=false}
  S=demo();
}
function fixS(){S.history=S.history||[];S.expenses=S.expenses||[];S.repairs=S.repairs||[];S.parcels=S.parcels||[];S.mphotos=S.mphotos||{};S.readings=S.readings||{};S.bills=S.bills||{};S.settings={...defSettings(),...S.settings}}
function prunePhotos(){const keep=[cur,prevKey(cur),prevKey(prevKey(cur)),monthKey(new Date()),prevKey(monthKey(new Date()))];Object.keys(S.mphotos||{}).forEach(k=>{if(!keep.includes(k))delete S.mphotos[k]})}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){storageOK=false;toast('⚠️ พื้นที่เก็บข้อมูลเต็ม ลองลบรูปเก่า')}}

function demo(){
  const k=monthKey(new Date()),p=prevKey(k);
  const list=[['101',3500,'สมชาย ใจดี','0812345678'],['102',3500,'สุดา รักเรียน','0898765432'],['103',3800,'วิชัย มั่นคง','0861112222'],['201',3000,'นภา สายบุญ','0823334444'],['202',3000,'ธนา ขยันดี','0845556666'],['203',3000,'','']];
  const rooms=list.map((a,i)=>({id:'r'+(i+1),no:a[0],rent:a[1],tenant:a[2],phone:a[3],deposit:a[2]?a[1]:0,advance:0,idCard:'',tAddress:'',termMonths:12,moveIn:a[2]?'2026-01-01':'',wStart:100+i*37,eStart:2000+i*311,feeLabel:'อินเทอร์เน็ต',fee:a[2]?200:0,note:''}));
  S={settings:{...defSettings(),name:'หอพักตัวอย่าง',ownerName:'นายเจ้าของ หอพัก',address:'123 ม.1 ต.ตัวอย่าง อ.เมือง จ.ตัวอย่าง',phone:'0899999999',amenities:'แอร์ · เตียง · ตู้เสื้อผ้า · WiFi · ที่จอดรถ'},rooms,readings:{},bills:{},history:[],expenses:[],repairs:[],parcels:[],mphotos:{},demo:true};
  S.readings[p]={};S.bills[p]={};
  rooms.forEach((r,i)=>{if(!r.tenant)return;
    const c={w:r.wStart+6+i,e:r.eStart+120+i*25};S.readings[p][r.id]=c;
    const b=calcBill(r,{w:r.wStart,e:r.eStart},c);b.paid=i!==2;b.paidDate=b.paid?p+'-0'+(3+i%3):'';S.bills[p][r.id]=b;});
  S.expenses=[{id:uid(),date:p+'-10',cat:'ค่าไฟจ่ายการไฟฟ้า',amt:2900,note:'บิลการไฟฟ้า'},{id:uid(),date:p+'-12',cat:'ค่าน้ำจ่ายการประปา',amt:600,note:''},{id:uid(),date:p+'-20',cat:'แม่บ้าน/ค่าจ้าง',amt:1500,note:''}];
  S.repairs=[{id:uid(),roomId:'r2',date:k+'-02',issue:'ก๊อกน้ำห้องน้ำรั่ว',status:'open',cost:0}];
  return S;
}

function defSettings(){return{name:'หอพักของฉัน',ownerName:'',address:'',phone:'',waterRate:15,waterMin:0,elecRate:5,elecMin:0,dueDay:5,promptpay:'',note:'ขอบคุณที่ชำระตรงเวลาครับ 🙏',lineId:'',mapUrl:'',amenities:'',appUrl:'',payChannels:'เงินสด · โอน/พร้อมเพย์ · บัตรเครดิต',bankInfo:'',lateFlat:0,latePerDay:0,lastBackup:'',taxId:'',married:false,seqInv:0,seqRc:0}}
const room=id=>S.rooms.find(r=>r.id===id);
const sortedRooms=()=>[...S.rooms].sort((a,b)=>String(a.no).localeCompare(String(b.no),'th',{numeric:true}));
const occRooms=()=>sortedRooms().filter(r=>r.tenant);

function getPrev(id,k){
  let kk=prevKey(k);
  for(let i=0;i<36;i++){const x=S.readings[kk]&&S.readings[kk][id];if(x&&x.w!=null&&x.e!=null)return{w:+x.w,e:+x.e};kk=prevKey(kk)}
  const r=room(id);return{w:+r.wStart||0,e:+r.eStart||0};
}
function calcBill(r,p,c,old={}){
  const s=S.settings;
  const wU=r2(Math.max(0,c.w-p.w)),eU=r2(Math.max(0,c.e-p.e));
  const wAmt=r2(Math.max(wU*(+s.waterRate||0),+s.waterMin||0)),eAmt=r2(Math.max(eU*(+s.elecRate||0),+s.elecMin||0));
  const rent=+r.rent||0,fee=+r.fee||0,other=+old.other||0;
  return{no:r.no,tenant:r.tenant,rent,wPrev:p.w,wCur:c.w,wUnits:wU,wAmt,ePrev:p.e,eCur:c.e,eUnits:eU,eAmt,feeLabel:r.feeLabel||'ค่าบริการ',fee,other,otherNote:old.otherNote||'',
    total:r2(rent+wAmt+eAmt+fee+other),paid:!!old.paid,paidDate:old.paidDate||'',payments:old.payments||null,warn:c.w<p.w||c.e<p.e};
}

/* ---------- shell ---------- */
/* หน้าจอแบบเรียบ: ตัดอีโมจิออกจากข้อความที่แสดงบนจอ (ข้อความที่ส่ง LINE ยังมีอีโมจิเหมือนเดิม) */
const plain=s=>String(s).replace(/\p{Extended_Pictographic}️?\s?/gu,'');
function V(h){$('view').innerHTML=plain(h);window.scrollTo(0,0)}
function go(t){tab=t;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function render(){
  $('dormName').textContent=S.settings.name||'หอพัก';document.title=(S.settings.name||'หอพัก')+' · JOE หอพัก';
  $('topSub').textContent='JOE หอพัก · '+S.rooms.length+' ห้อง · มีผู้เช่า '+occRooms().length;
  ({home:renderHome,meter:renderMeter,bills:renderBills,rooms:renderRooms,money:renderMoney,settings:renderSettings})[tab]();
}
function buildMonths(){
  const sel=$('monthSel');const now=monthKey(new Date());let k=nextKey(now),opts=[];
  for(let i=0;i<14;i++){opts.push(k);k=prevKey(k)}
  sel.innerHTML=opts.map(o=>`<option value="${o}" ${o===cur?'selected':''}>${monthLabel(o)}</option>`).join('');
  sel.onchange=()=>{cur=sel.value;render()};
}
function sheet(h){$('sheet').innerHTML=plain(h);$('modal').classList.remove('hidden')}
function closeM(){$('modal').classList.add('hidden')}
let tt;function toast(m){const t=$('toast');t.textContent=plain(m);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function lineUrl(t){return 'https://line.me/R/msg/text/?'+encodeURIComponent(t)}
function copyText(t){
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('คัดลอกแล้ว')}catch(e){toast('คัดลอกไม่ได้')}a.remove()};
  try{navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว'),fb)}catch(e){fb()}
}

/* ---------- home ---------- */
function unpaidAll(){
  const out=[];Object.keys(S.bills).sort().forEach(k=>{Object.entries(S.bills[k]).forEach(([id,b])=>{if(!b.paid)out.push({k,id,b})})});return out;
}
const METHODS=['เงินสด','โอน/พร้อมเพย์','บัตรเครดิต','อื่นๆ'];
function paidSum(b){return b.payments&&b.payments.length?r2(b.payments.reduce((a,p)=>a+(+p.amt||0),0)):(b.paid?b.total:0)}
function remain(b){return r2(Math.max(0,b.total-paidSum(b)))}
function methodsOf(b){return b.payments&&b.payments.length?[...new Set(b.payments.map(p=>p.method))].join(', '):''}
function syncPaid(b){if(b.payments&&b.payments.length){b.paid=paidSum(b)>=b.total-0.001;b.paidDate=b.payments[b.payments.length-1].date}}
function statusChip(b){if(b.paid)return`<span class="chip ok">ชำระแล้ว${methodsOf(b)?' · '+esc(methodsOf(b)):''}</span>`;
  return paidSum(b)>0?`<span class="chip warn">ค้าง ${baht(remain(b))}</span>`:'<span class="chip bad">ค้าง</span>'}
function renderHome(){
  const k=cur,bills=S.bills[k]||{},arr=Object.values(bills);
  const billed=arr.reduce((a,b)=>a+b.total,0),paid=arr.reduce((a,b)=>a+paidSum(b),0);
  const occ=occRooms(),notRead=occ.filter(r=>!(S.readings[k]&&S.readings[k][r.id])).length;
  const un=unpaidAll(),unSum=un.reduce((a,x)=>a+remain(x.b),0);
  let h='';
  if(S.demo)h+=`<div class="banner">👋 นี่คือ<b>ข้อมูลตัวอย่าง</b> ลองกดเล่นได้เลย เมื่อพร้อมใช้จริง ไปที่ <b>ตั้งค่า → ล้างข้อมูลทั้งหมด</b> แล้วเพิ่มห้องของคุณ</div>`;
  if(!storageOK)h+=`<div class="hint sm">⚠️ เบราว์เซอร์นี้บันทึกข้อมูลไม่ได้ ข้อมูลจะหายเมื่อปิดหน้า</div>`;
  const lb=S.settings.lastBackup,bdays=lb?Math.floor((new Date(today())-new Date(lb))/864e5):999;
  if(!S.demo&&S.rooms.length&&bdays>=30)h+=`<div class="hint sm">🛟 ${lb?'สำรองข้อมูลครั้งล่าสุด '+bdays+' วันก่อน':'ยังไม่เคยสำรองข้อมูล'} — ข้อมูลอยู่ในเครื่องนี้เท่านั้น <button class="btn sm" onclick="go('settings')">สำรองเลย</button></div>`;
  h+=`<div class="stats">
    <div class="stat"><div class="l">ห้องทั้งหมด</div><div class="v">${S.rooms.length}</div></div>
    <div class="stat pri"><div class="l">มีผู้เช่า</div><div class="v">${occ.length}</div></div>
    <div class="stat"><div class="l">ห้องว่าง</div><div class="v">${S.rooms.length-occ.length}</div></div></div>
  <div class="card"><div class="h">${monthLabel(k)}</div>
    <div class="stats" style="margin:10px 0 0">
      <div class="stat"><div class="l">ยอดบิล</div><div class="v">${baht(billed)}</div></div>
      <div class="stat ok"><div class="l">รับแล้ว</div><div class="v">${baht(paid)}</div></div>
      <div class="stat bad"><div class="l">ค้าง</div><div class="v">${baht(billed-paid)}</div></div></div>
    ${occ.length&&notRead?`<button class="btn pri block" onclick="go('meter')">📟 ยังไม่จดมิเตอร์ ${notRead} ห้อง — จดเลย</button>`:''}
    ${arr.length?`<a class="btn line block" href="${lineUrl(summaryText(k))}" target="_blank" rel="noopener">💬 ส่งสรุปเดือนนี้ทาง LINE</a>`:''}
  </div>
  ${roomMap(k)}
  <div id="installBox"></div>
  <div class="home-grid"><div class="card"><div class="mhead"><div class="h">📢 ห้องว่าง ${S.rooms.length-occ.length} ห้อง</div></div><div class="sm mut">สร้างป้ายประกาศพร้อม QR ให้คนหาห้องสแกนติดต่อ แคปไปโพสต์หรือพิมพ์ติดหน้าหอ</div>
    <button class="btn pri block" onclick="openPoster()">📢 สร้างป้ายประกาศห้องว่าง</button></div>
  <div class="card"><div class="mhead"><div class="h">ค้างชำระทั้งหมด</div><b class="bad">${baht(unSum)} ฿</b></div>`;

/* PromptPay EMVCo payload */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
  const f=(t,v)=>t+pad(v.length)+v;let d=String(id).replace(/\D/g,''),acc;
  if(d.length>=13)acc=f(d.length>=15?'03':'02',d);
  else{if(d.startsWith('0'))d='66'+d.slice(1);acc=f('01',('0000000000000'+d).slice(-13))}
  const p=f('00','01')+f('01',amount?'12':'11')+f('29',f('00','A000000677010111')+acc)+f('53','764')+(amount?f('54',(+amount).toFixed(2)):'')+f('58','TH')+'6304';
  return p+crc16(p);
}

function saveRoom(id){
  const v=f=>$('f_'+f).value.trim();
  if(!v('no')||v('rent')===''){toast('กรอกเลขห้องและค่าห้อง');return}
  if(S.rooms.some(r=>r.no===v('no')&&r.id!==id)){toast('มีเลขห้องนี้แล้ว');return}
  const d={no:v('no'),rent:+v('rent'),tenant:v('tenant'),phone:v('phone'),deposit:+v('deposit')||0,advance:+v('advance')||0,idCard:v('idCard'),tAddress:v('tAddress'),termMonths:+v('termMonths')||12,moveIn:v('moveIn'),wStart:+v('wStart')||0,eStart:+v('eStart')||0,feeLabel:v('feeLabel')||'ค่าบริการ',fee:+v('fee')||0,note:v('note'),flag:$('f_flag').value,pdpa:$('f_pdpa').checked};
  if(d.tenant&&d.idCard&&!d.pdpa){toast('กรุณาให้ผู้เช่ายินยอมเรื่องข้อมูลส่วนตัวก่อน');return}
  if(id)Object.assign(room(id),d);else S.rooms.push({id:uid(),...d});
  save();closeM();toast(d.deposit+d.advance>d.rent*3?'บันทึกแล้ว · แนะนำให้ประกัน+ล่วงหน้าไม่เกิน 3 เดือน':'บันทึกแล้ว');render();
}
function delRoom(id){
  const b=$('delBtn');if(!b.dataset.c){b.dataset.c=1;b.textContent='แตะอีกครั้งเพื่อยืนยันการลบ';return}
  S.rooms=S.rooms.filter(r=>r.id!==id);save();closeM();toast('ลบแล้ว');render();
}

function addMonths(s,n){if(!s)return'';const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+(+n||0));d.setDate(d.getDate()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

return `สัญญาเช่าห้องพักเพื่ออยู่อาศัย

ทำที่ ${dots(s.name)} ${s.address||''}

ข้อ 1 ทรัพย์ที่เช่า

มีกำหนด ${r.termMonths||12} เดือน เริ่มวันที่ ${thDate(r.moveIn)} สิ้นสุดวันที่ ${thDate(addMonths(r.moveIn,r.termMonths||12))}

ข้อ 3 ค่าเช่า

คิดตามมิเตอร์ที่ใช้จริง ค่าน้ำหน่วยละ ${s.waterRate} บาท ค่าไฟฟ้าหน่วยละ ${s.elecRate} บาท ซึ่งไม่เกินอัตราที่หน่วยงานของรัฐเรียกเก็บจากผู้ให้เช่า${+r.fee?` และ${r.feeLabel||'ค่าบริการ'}เดือนละ ${baht(r.fee)} บาท`:''}

ข้อ 5 เงินประกันและค่าเช่าล่วงหน้า
ผู้เช่าวางเงินประกัน ${baht(r.deposit||0)} บาท${+r.advance?` และค่าเช่าล่วงหน้า ${baht(r.advance)} บาท`:''} ในวันทำสัญญา เมื่อสัญญาสิ้นสุดและผู้เช่าส่งมอบห้องคืนแล้ว ผู้ให้เช่าจะคืนเงินประกันภายใน 7 วัน หากมีความเสียหายที่ผู้เช่าต้องรับผิดชอบ ผู้ให้เช่าจะหักได้เฉพาะค่าเสียหายที่เกิดขึ้นจริงพร้อมแสดงหลักฐาน และคืนส่วนที่เหลือภายใน 14 วัน ทั้งนี้จะไม่หักค่าเสื่อมสภาพจากการใช้งานตามปกติ

ข้อ 6 หน้าที่ของผู้เช่า
ผู้เช่าจะดูแลรักษาห้องและอุปกรณ์เสมือนวิญญูชนพึงรักษาทรัพย์สินของตนเอง ไม่ดัดแปลงต่อเติมโดยไม่ได้รับอนุญาตเป็นหนังสือ ไม่นำห้องไปให้เช่าช่วง ไม่ใช้ห้องกระทำผิดกฎหมายหรือก่อความเดือดร้อนรำคาญแก่ผู้อื่น

ผู้ให้เช่าเข้าตรวจห้องได้ในเวลาอันสมควร โดยแจ้งให้ผู้เช่าทราบล่วงหน้า เว้นแต่กรณีเหตุฉุกเฉิน

ผู้เช่าบอกเลิกสัญญาก่อนครบกำหนดได้ โดยแจ้งเป็นหนังสือล่วงหน้าไม่น้อยกว่า 30 วัน ผู้ให้เช่าบอกเลิกสัญญาได้เมื่อผู้เช่าผิดนัดชำระค่าเช่าหรือผิดสัญญาในข้อสาระสำคัญ และได้แจ้งเป็นหนังสือให้แก้ไขแล้วผู้เช่าไม่แก้ไข

เมื่อสัญญาสิ้นสุด ผู้เช่าจะส่งมอบห้องคืนในสภาพเรียบร้อย โดยทั้งสองฝ่ายร่วมกันตรวจสภาพห้องและจดเลขมิเตอร์ครั้งสุดท้าย

ผู้เช่ายินยอมให้ผู้ให้เช่าเก็บและใช้ข้อมูลส่วนบุคคลเท่าที่จำเป็นเพื่อการทำสัญญา การออกใบแจ้งหนี้ และการติดต่อเท่านั้น ผู้ให้เช่าจะไม่เปิดเผยแก่บุคคลอื่นโดยไม่ได้รับความยินยอม เว้นแต่กฎหมายกำหนด และจะลบข้อมูลเลขประจำตัวประชาชนออกจากระบบเมื่อสัญญาสิ้นสุด

สัญญานี้ทำขึ้นเป็นสองฉบับ มีข้อความถูกต้องตรงกัน คู่สัญญาได้อ่านและเข้าใจข้อความโดยตลอดแล้ว จึงลงลายมือชื่อไว้เป็นสำคัญ และต่างเก็บไว้ฝ่ายละหนึ่งฉบับ

function openMoveOut(id){const r=room(id),k=monthKey(new Date()),p=getPrev(id,k),rd=(S.readings[k]||{})[id];

  ${un.length?`<div class="sec">บิลค้างชำระ</div>${un.map(x=>`<div class="sm">• ${monthLabel(x.k)} — ${baht(remain(x.b))} บาท</div>`).join('')}`:''}

  <button class="btn pri block big" id="moBtn" onclick="doMoveOut('${id}')">✅ ยืนยันย้ายออก</button>`);moCalc(id)}
function moData(id){const r=room(id),k=monthKey(new Date()),p=getPrev(id,k),rd=(S.readings[k]||{})[id];
  const w=$('mo_w').value,e=$('mo_e').value;
  const fin=(w!==''&&e!=='')?calcBill({...r,rent:+$('mo_rent').value||0,fee:0},p,{w:+w,e:+e}):null;
  const un=unpaidAll().filter(x=>x.id===id&&!(x.k===k&&rd));
  const ded=[1,2,3].map(i=>({label:$('mo_dl'+i).value.trim()||'ค่าเสียหาย',amt:+$('mo_da'+i).value||0})).filter(d=>d.amt>0);
  const hold=(+r.deposit||0)+(+r.advance||0),unSum=un.reduce((a,x)=>a+remain(x.b),0),dSum=ded.reduce((a,d)=>a+d.amt,0),finSum=fin?fin.total:0;
  return{r,k,fin,un,ded,hold,unSum,dSum,finSum,refund:r2(hold-unSum-dSum-finSum),date:$('mo_date').value||today()}}
function moCalc(id){const d=moData(id);
  const dl=d.ded.length?14:7,due=(()=>{const x=new Date(d.date+'T00:00:00');x.setDate(x.getDate()+dl);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())})();
  $('mo_res').innerHTML=`<table class="bill"><tr><td>เงินประกัน + ค่าเช่าล่วงหน้า</td><td>${baht(d.hold)}</td></tr>
  ${d.fin?`<tr><td>บิลสุดท้าย (น้ำ ${d.fin.wUnits} · ไฟ ${d.fin.eUnits} หน่วย${d.fin.rent?' + ค่าห้อง':''})</td><td class="neg">−${baht(d.finSum)}</td></tr>`:`<tr><td colspan="2" class="sm mut">กรอกมิเตอร์สุดท้ายเพื่อคิดค่าน้ำไฟ</td></tr>`}
  ${d.unSum?`<tr><td>บิลค้างชำระ</td><td class="neg">−${baht(d.unSum)}</td></tr>`:''}
  ${d.ded.map(x=>`<tr><td>${esc(x.label)}</td><td class="neg">−${baht(x.amt)}</td></tr>`).join('')}
  <tr class="tot"><td>${d.refund>=0?'คืนผู้เช่า':'ผู้เช่าต้องจ่ายเพิ่ม'}</td><td class="${d.refund>=0?'':'neg'}">${baht(Math.abs(d.refund))} ฿</td></tr></table>
  ${d.refund>0?`<div class="hint sm">⏰ แนะนำให้คืนภายใน ${dl} วัน (ภายใน ${fmtDate(due)}) อ้างอิงประกาศ สคบ.</div>`:''}`}
function moveOutText(x){const s=S.settings;
  let t=`🏠 ${s.name}\nสรุปการย้ายออก ห้อง ${x.roomNo}\nผู้เช่า: ${x.tenant}\nวันที่ส่งมอบห้อง: ${fmtDate(x.moveOut)}\n──────────\nเงินประกัน + ค่าเช่าล่วงหน้า: ${baht(x.hold)} บาท\n`;
  if(x.fin)t+=`หัก บิลสุดท้าย (น้ำ ${x.fin.wPrev}→${x.fin.wCur} · ไฟ ${x.fin.ePrev}→${x.fin.eCur}): ${baht(x.fin.total)} บาท\n`;
  if(x.unSum)t+=`หัก บิลค้างชำระ: ${baht(x.unSum)} บาท\n`;

function doMoveOut(id){const b=$('moBtn');if(!b.dataset.c){b.dataset.c=1;b.textContent='แตะอีกครั้งเพื่อยืนยัน';return}
  const d=moData(id),r=d.r,mk=d.date.slice(0,7);

    S.bills[mk][id]={...d.fin,tenant:r.tenant,paid:true,paidDate:d.date,payments:[{date:d.date,amt:d.fin.total,method:'หักเงินประกัน',note:''}]};r.wStart=d.fin.wCur;r.eStart=d.fin.eCur}
  d.un.forEach(x=>{const rm=remain(x.b);if(!x.b.payments||!x.b.payments.length)x.b.payments=paidSum(x.b)?[{date:x.b.paidDate||d.date,amt:paidSum(x.b),method:'ไม่ระบุ',note:''}]:[];
    x.b.payments.push({date:d.date,amt:rm,method:'หักเงินประกัน',note:''});syncPaid(x.b)});
  const h={id:uid(),roomNo:r.no,tenant:r.tenant,phone:r.phone,moveIn:r.moveIn,moveOut:d.date,hold:d.hold,fin:d.fin,unSum:d.unSum,ded:d.ded,refund:d.refund};
  S.history.push(h);
  Object.assign(r,{tenant:'',phone:'',idCard:'',tAddress:'',deposit:0,advance:0,moveIn:'',pdpa:false,photos:[],flag:''});
  save();toast('บันทึกการย้ายออกแล้ว');openHist(h.id);render()}

/* ================= v2: ผังห้อง ค่าปรับ รูป พัสดุ บัญชี งานซ่อม สำรองข้อมูล ================= */
function dueDate(k){const[y,m]=nextKey(k).split('-').map(Number);const last=new Date(y,m,0).getDate();return new Date(y,m-1,Math.min(+S.settings.dueDay||5,last))}
function daysLate(k){const t=new Date(today()+'T00:00:00');return Math.round((t-dueDate(k))/864e5)}
function roomState(r,k){
  if(r.flag==='fix')return['fix','ซ่อม'];if(!r.tenant)return r.flag==='resv'?['resv','จองแล้ว']:['empty','ว่าง'];
  const b=(S.bills[k]||{})[r.id];const old=unpaidAll().some(x=>x.id===r.id&&x.k<k);
  if(old||(b&&!b.paid&&daysLate(k)>0))return['due','ค้าง'];
  if(b&&b.paid)return['paid','จ่ายแล้ว'];return['wait',b?'รอจ่าย':'ยังไม่ออกบิล'];
}
function roomMap(k){const rs=sortedRooms();if(!rs.length)return'';
  const fixN=S.repairs.filter(x=>x.status!=='done');
  return `<div class="card"><div class="mhead"><div class="h">ผังห้อง · ${monthLabel(k)}</div>${fixN.length?`<span class="sm" style="color:var(--warn);cursor:pointer" onclick="go('money')">🔧 งานซ่อมค้าง ${fixN.length}</span>`:''}</div>
  <div class="rmap">${rs.map(r=>{const[c,t]=roomState(r,k);const fx=fixN.some(x=>x.roomId===r.id);return `<div class="tile ${c}" onclick="tileClick('${r.id}')"><b>${esc(r.no)}${fx?' 🔧':''}</b>${t}</div>`}).join('')}</div>
  <div class="legend"><span><i style="background:var(--ok2)"></i>จ่ายแล้ว</span><span><i style="background:#fff"></i>รอจ่าย</span><span><i style="background:var(--bad2)"></i>ค้าง/เลยกำหนด</span><span><i style="background:#f1eee8"></i>ว่าง</span><span><i style="background:#eaf0f6"></i>จอง</span><span><i style="background:var(--warn2)"></i>ซ่อม</span></div></div>`}
function tileClick(id){const b=(S.bills[cur]||{})[id];if(b)openBill(cur,id);else editRoom(id)}
function lateFee(k){const s=S.settings,d=daysLate(k);if(d<=0)return 0;return r2((+s.lateFlat||0)+(+s.latePerDay||0)*d)}
function lateBox(k,id){const b=S.bills[k][id];if(b.paid)return'';const d=daysLate(k);if(d<=0)return'';
  const f=lateFee(k),has=/ค่าปรับ/.test(b.otherNote||'');
  return `<div class="hint sm">⏰ เลยกำหนดชำระ ${d} วัน${f&&!has?` · ค่าปรับตามที่ตั้งไว้ ${baht(f)} บาท <button class="btn sm" onclick="addLate('${k}','${id}')">เพิ่มเข้าบิล</button>`:''}${!f?' · ตั้งค่าปรับได้ในหน้าตั้งค่า':''}</div>`}
function addLate(k,id){const b=S.bills[k][id],f=lateFee(k),d=daysLate(k);b.other=r2((+b.other||0)+f);b.otherNote=((b.otherNote?b.otherNote+' + ':'')+'ค่าปรับจ่ายช้า '+d+' วัน');
  b.total=r2(b.rent+b.wAmt+b.eAmt+b.fee+b.other);syncPaid(b);save();toast('เพิ่มค่าปรับแล้ว');openBill(k,id);render()}
function abnormal(id,b){const hist=[];let kk=prevKey(cur);for(let i=0;i<6&&hist.length<3;i++){const x=(S.bills[kk]||{})[id];if(x)hist.push(x);kk=prevKey(kk)}
  if(hist.length<2)return'';const aw=hist.reduce((a,x)=>a+x.wUnits,0)/hist.length,ae=hist.reduce((a,x)=>a+x.eUnits,0)/hist.length;let m='';
  if(b.wUnits>Math.max(aw*1.8,aw+5))m+=`<div style="color:var(--warn)">💧 น้ำสูงกว่าปกติ (เฉลี่ย ${r2(aw)} หน่วย) — อาจมีน้ำรั่ว ลองตรวจก๊อก/ชักโครก</div>`;
  if(b.eUnits>Math.max(ae*1.8,ae+40))m+=`<div style="color:var(--warn)">⚡ ไฟสูงกว่าปกติ (เฉลี่ย ${r2(ae)} หน่วย) — ตรวจเลขมิเตอร์อีกครั้ง</div>`;return m}
function shrink(file,maxW,q){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}
async function meterPhoto(inp,id){const f=inp.files[0];if(!f)return;try{const keep={};occRooms().forEach(r=>{const w=$('w_'+r.id),e=$('e_'+r.id);if(w)keep[r.id]=[w.value,e.value]});
  const u=await shrink(f,480,.55);S.mphotos[cur]=S.mphotos[cur]||{};S.mphotos[cur][id]=u;prunePhotos();save();renderMeter();
  Object.entries(keep).forEach(([i,[w,e]])=>{$('w_'+i).value=w;$('e_'+i).value=e;mPrev(i)});toast('บันทึกรูปแล้ว')}catch(e){toast('โหลดรูปไม่สำเร็จ')}}
async function condPhoto(inp,id){const r=room(id);r.photos=r.photos||[];const fs=[...inp.files].slice(0,4-r.photos.length);if(!fs.length){toast('ครบ 4 รูปแล้ว');return}
  try{for(const f of fs)r.photos.push(await shrink(f,420,.5));save();editRoom(id);toast('เพิ่มรูปแล้ว')}catch(e){toast('โหลดรูปไม่สำเร็จ')}}
function clearCond(id){room(id).photos=[];save();editRoom(id)}
function viewImg(u){const d=document.createElement('div');d.className='modal';d.style.alignItems='center';d.style.zIndex=30;d.onclick=()=>d.remove();d.innerHTML=`<img src="${u}" style="max-width:94vw;max-height:88vh;border-radius:8px">`;document.body.appendChild(d)}

function bahtText(n){n=Math.round((+n||0)*100)/100;const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=x=>{x=String(x);if(+x===0)return'';if(x.length>6){return rd(x.slice(0,-6))+'ล้าน'+rd(x.slice(-6))}let t='';const L=x.length;
    for(let i=0;i<L;i++){const d=+x[i],pos=L-i-1;if(!d)continue;if(pos===1&&d===1)t+='สิบ';else if(pos===1&&d===2)t+='ยี่สิบ';else if(pos===0&&d===1&&L>1&&+x[L-2]!==0)t+='เอ็ด';else if(pos===0&&d===1&&L>1)t+='เอ็ด';else t+=D[d]+P[pos]}return t};
  const b=Math.floor(n),st=Math.round((n-b)*100);let t=(b?rd(b):'ศูนย์')+'บาท';t+=st?rd(st)+'สตางค์':'ถ้วน';return t}

function paymentsInYear(y){const out=[];
  Object.entries(S.bills).forEach(([k,bs])=>Object.entries(bs).forEach(([id,b])=>{
    const ps=b.payments&&b.payments.length?b.payments:(b.paid?[{date:b.paidDate||k+'-01',amt:b.total,method:'ไม่ระบุ'}]:[]);
    ps.forEach((p,i)=>{if(p.method==='หักเงินประกัน'||!(p.date||'').startsWith(y))return;const sh=b.total?p.amt/b.total:0;
      out.push({k,id,i,b,p,rent:r2(b.rent*sh),util:r2((b.wAmt+b.eAmt)*sh),svc:r2((b.fee+b.other)*sh)})})}));
  return out.sort((a,b)=>a.p.date<b.p.date?-1:1)}
function taxCard(y){const s=S.settings,all=paymentsInYear(y),h1=all.filter(x=>x.p.date.slice(5,7)<='06');

  const Y=sum(all),H=sum(h1),lim=s.married?120000:60000,need94=H.tot>lim,real=r2(S.expenses.filter(e=>(e.date||'').startsWith(y)&&e.cat!=='ผ่อนธนาคาร').reduce((t,e)=>t+e.amt,0));

  <tr class="tot"><td>เงินได้ 40(5) รวม</td><td>${baht(Y.tot)} ฿</td></tr>

  <div class="sm mut" style="margin-top:8px">เป็นตัวเลขช่วยเตรียมยื่นแบบ ภาษีจริงต้องรวมเงินได้อื่น (เช่น เงินเดือน) และค่าลดหย่อน ควรตรวจกับกรมสรรพากร (โทร 1161) ก่อนยื่น · ค่าน้ำไฟที่เก็บแทนต้องรวมเป็นเงินได้หรือไม่ ควรสอบถามสรรพากร</div>

function taxText(y){const s=S.settings,all=paymentsInYear(y),tot=r2(all.reduce((t,x)=>t+x.p.amt,0)),h=r2(all.filter(x=>x.p.date.slice(5,7)<='06').reduce((t,x)=>t+x.p.amt,0));
  return `สรุปเงินได้ค่าเช่า 40(5) ปีภาษี ${+y+543}\n${s.name} · ผู้ให้เช่า ${s.ownerName||'-'}\nครึ่งปีแรก (ม.ค.–มิ.ย.): ${baht(h)} บาท\nทั้งปี: ${baht(tot)} บาท\nหักค่าใช้จ่ายเหมา 30%: ${baht(tot*.3)} บาท\nคงเหลือ: ${baht(tot*.7)} บาท\nจำนวนใบเสร็จ: ${all.length} ใบ`}
function openRcList(y){const all=paymentsInYear(y);

  <button class="btn block" onclick="copyText(rcCsv('${y}'))">คัดลอกเป็นตาราง (วางใน Excel/Sheets)</button>`)}
function rcCsv(y){return ['เลขที่\tวันที่\tห้อง\tผู้เช่า\tเดือนบิล\tวิธีชำระ\tจำนวนเงิน'].concat(paymentsInYear(y).map(x=>[x.p.rc||'',x.p.date,x.b.no,x.b.tenant,monthLabel(x.k),x.p.method,x.p.amt].join('\t'))).join('\n')}

 {k:['รายจ่าย','กำไร','บัญชี','รายรับ'],q:'บันทึกรายจ่าย / ดูกำไร',a:'แท็บ บัญชี → "+ เพิ่ม" ในรายจ่าย ระบบสรุปรับ−จ่าย=กำไรรายเดือน และทั้งปี',go:'money'},
 {k:['ซ่อม','แจ้งซ่อม','เสีย','รั่ว'],q:'งานซ่อม',a:'บัญชี → "+ แจ้งซ่อม" ติดตามสถานะ รอ/กำลังซ่อม/เสร็จ เมื่อเสร็จและใส่ค่าซ่อม ระบบบันทึกเป็นรายจ่ายให้อัตโนมัติ ห้องที่มีงานซ่อมค้างจะขึ้นในผังห้อง',go:'money'},
 {k:['พัสดุ','ของมาส่ง','kerry','flash','ไปรษณีย์'],q:'รับพัสดุแทนผู้เช่า',a:'หน้าหลัก → การ์ด "พัสดุรอรับ" → "+ รับพัสดุ" แล้วกด "แจ้ง" ส่ง LINE บอกผู้เช่า เมื่อมารับกด "รับแล้ว"',go:'home'},
 {k:['สี','ผังห้อง','สีแดง','สีเขียว'],q:'สีในผังห้องหมายถึงอะไร',a:'เขียว = จ่ายแล้ว · ขาว = รอจ่าย · แดง = ค้าง/เลยกำหนด · เทา = ว่าง · ฟ้า = จองแล้ว · ส้ม = ปิดซ่อม'},
 {k:['ฟรี','ราคา','เสียเงิน','ค่าบริการ','pro','โปร'],q:'ฟรีจริงไหม / Pro คืออะไร',a:'ฟีเจอร์พื้นฐานทั้งหมดในแอปนี้ใช้ฟรีตลอด ฟีเจอร์ที่เคยฟรีจะฟรีตลอด\nPro (กำลังพัฒนา) สำหรับสิ่งที่ต้องใช้เซิร์ฟเวอร์ เช่น ใช้หลายเครื่อง หน้าผู้เช่า แจ้ง LINE อัตโนมัติ'},
 {k:['พิมพ์','print','ปริ้น'],q:'พิมพ์เอกสาร',a:'สัญญา: กด "พิมพ์" ในหน้าสัญญา หรือคัดลอกไปวางใน Word\nบิล/ใบเสร็จ: บันทึกรูปแล้วพิมพ์จากแกลเลอรี'},
];
const GREET=['สวัสดี','หวัดดี','hello','hi','ดีครับ','ดีค่ะ'],THANK=['ขอบคุณ','thank','ขอบใจ'];
const norm=t=>String(t).toLowerCase().replace(/\s+/g,'');
function botAnswer(q){const n=norm(q);
  if(GREET.some(g=>n.startsWith(g))&&n.length<12)return{a:'สวัสดีครับ ผมน้องโจ้ ผู้ช่วยของ JOE หอพัก ถามเรื่องการใช้งานได้เลยครับ หรือแตะหัวข้อด้านล่าง'};
  if(THANK.some(g=>n.includes(g)))return{a:'ยินดีครับ มีอะไรถามได้ตลอดนะครับ 🙏'};
  let best=null,sc=0;FAQ.forEach(f=>{let x=0;f.k.forEach(k=>{if(n.includes(norm(k)))x+=norm(k).length});if(x>sc){sc=x;best=f}});
  if(best)return best;return null}
let botLog=[];
function openBot(){if(!botLog.length)botLog.push({me:false,t:'สวัสดีครับ ผมน้องโจ้ 👋 ช่วยตอบเรื่องการใช้ JOE หอพัก พิมพ์คำถาม หรือแตะหัวข้อด้านล่างได้เลย'});
  sheet(`<div class="sh-h"><div><div class="h">ถามน้องโจ้</div><div class="sm mut">ผู้ช่วยตอบคำถามการใช้งาน · ทำงานในเครื่อง</div></div><button class="x" onclick="closeM()">✕</button></div>
  <div class="chat" id="chatLog"></div>
  <div class="chips" id="chatChips"></div>
  <form class="chatin" onsubmit="event.preventDefault();botSend()"><input id="chatIn" placeholder="พิมพ์คำถาม เช่น ออกใบเสร็จยังไง" autocomplete="off"><button class="btn pri" type="submit">ส่ง</button></form>`);
  drawBot()}
function drawBot(){const el=$('chatLog');if(!el)return;
  el.innerHTML=botLog.map(m=>`<div class="msg ${m.me?'me':'bot'}">${esc(m.t)}${m.go?`<div style="margin-top:6px"><button class="btn sm" onclick="closeM();go('${m.go}')">ไปที่หน้านั้น →</button></div>`:''}${m.ask?`<div style="margin-top:6px">${SUPPORT_LINE?`<a class="btn sm line" href="${lineUrl('คำถามถึงทีม JOE หอพัก: '+m.ask)}" target="_blank" rel="noopener">ส่งคำถามถึงทีม JOE</a>`:`<button class="btn sm" onclick="copyText(${esc(JSON.stringify('คำถามถึงทีม JOE หอพัก: '+m.ask))})">คัดลอกคำถามไว้ส่งทีม JOE</button>`}</div>`:''}</div>`).join('');
  el.scrollTop=el.scrollHeight;
  const pick=['เริ่มใช้งานยังไง','ส่งบิลให้ผู้เช่าทาง LINE','ออกใบเสร็จรับเงิน','สำรองข้อมูล / ย้ายเครื่อง','ย้ายออก / คืนเงินประกัน','ยื่นภาษีค่าเช่า'];
  $('chatChips').innerHTML=pick.map(q=>`<button type="button" onclick="botSend(${esc(JSON.stringify(q))})">${esc(q)}</button>`).join('')}
function botSend(q){const inp=$('chatIn');q=(q||(inp&&inp.value)||'').trim();if(!q)return;if(inp)inp.value='';
  botLog.push({me:true,t:q});const r=botAnswer(q);
  if(r)botLog.push({me:false,t:r.a,go:r.go});
  else{const sug=FAQ.filter(f=>f.k.some(k=>norm(q).includes(norm(k).slice(0,3)))).slice(0,3).map(f=>f.q);
    botLog.push({me:false,t:'ขอโทษครับ น้องโจ้ยังตอบคำถามนี้ไม่ได้'+(sug.length?'\nหมายถึงเรื่องนี้หรือเปล่า: '+sug.join(' / '):'')+'\nลองพิมพ์คำสั้นๆ เช่น "ใบเสร็จ" "มิเตอร์" "ย้ายออก" หรือส่งคำถามถึงทีม JOE',ask:q})}
  if(botLog.length>60)botLog=botLog.slice(-60);drawBot();setTimeout(()=>{const i=$('chatIn');i&&i.focus()},50)}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  const ins=[...document.querySelectorAll('#view input, #sheet input')].filter(i=>i.offsetParent!==null);const i=ins.indexOf(e.target);
  if(i>-1&&i<ins.length-1){e.preventDefault();ins[i+1].focus();ins[i+1].select&&ins[i+1].select()}});
if(window.matchMedia('(min-width:900px)').matches)document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
/* ---------- bill image + pay link ---------- */
const dueText=k=>`${S.settings.dueDay} ${monthLabel(nextKey(k))}`;
function b64e(o){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t),c=>c.charCodeAt(0))))}
function payLink(k,id){const s=S.settings,b=S.bills[k][id];if(!s.appUrl||!s.promptpay||b.paid)return'';
  const base=s.appUrl.split('?')[0].split('#')[0];
  return base+'?pay='+b64e({n:s.name,r:b.no,t:b.tenant,m:monthLabel(k),a:remain(b),p:s.promptpay,d:dueText(k),ph:s.phone||''})}
function qrModules(text){const q=qrcode(0,'M');q.addData(text);q.make();return q}
function drawQR(ctx,text,x,y,size){const q=qrModules(text),n=q.getModuleCount(),cell=Math.floor(size/(n+4)),off=Math.floor((size-cell*n)/2);
  ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);ctx.fillStyle='#111';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(x+off+c*cell,y+off+r*cell,cell,cell)}
function makeBillCanvas(k,id){ensureInv(k,id);
  const s=S.settings,b=S.bills[k][id],W=720,F="'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',sans-serif";
  const rows=[['ค่าห้อง',b.rent],[`ค่าน้ำ  ${b.wPrev} → ${b.wCur} (${b.wUnits} หน่วย)`,b.wAmt],[`ค่าไฟ  ${b.ePrev} → ${b.eCur} (${b.eUnits} หน่วย)`,b.eAmt]];
  if(b.fee)rows.push([b.feeLabel,b.fee]);if(b.other)rows.push([b.otherNote||'ค่าอื่นๆ',b.other]);
  const showQR=!b.paid&&s.promptpay&&typeof qrcode!=='undefined';
  const H=150+120+rows.length*56+80+(showQR?400:0)+(b.paid?110:110)+140;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#f5f3ee';x.fillRect(0,0,W,H);
  x.fillStyle='#2f5d50';x.fillRect(0,0,W,150);
  x.fillStyle='#fff';x.font=`700 36px ${F}`;x.fillText(s.name||'หอพัก',40,68);
  x.font=`400 24px ${F}`;x.fillStyle='#dfe8e2';x.fillText('ใบแจ้งหนี้ เลขที่ '+(b.inv||'-')+' · '+monthLabel(k),40,112);
  x.fillStyle='#fff';x.beginPath();x.roundRect?x.roundRect(24,170,W-48,H-194,24):x.rect(24,170,W-48,H-194);x.fill();
  let y=225;x.fillStyle='#1c2a2b';x.font=`700 34px ${F}`;x.fillText('ห้อง '+b.no,56,y);
  x.font=`400 24px ${F}`;x.fillStyle='#5d6b6c';x.textAlign='right';x.fillText(b.tenant||'',W-56,y);x.textAlign='left';
  y+=55;x.font=`400 24px ${F}`;
  rows.forEach(([l,v])=>{x.fillStyle='#1c2a2b';x.fillText(l,56,y);x.textAlign='right';x.fillText(baht(v)+' ฿',W-56,y);x.textAlign='left';
    x.strokeStyle='#e2ddd2';x.setLineDash([6,6]);x.beginPath();x.moveTo(56,y+20);x.lineTo(W-56,y+20);x.stroke();x.setLineDash([]);y+=56});
  y+=20;x.fillStyle='#22211e';x.font=`700 40px ${F}`;x.fillText('รวม',56,y);x.textAlign='right';x.fillText(baht(b.total)+' บาท',W-56,y);x.textAlign='left';
  y+=40;
  if(showQR){drawQR(x,ppPayload(s.promptpay,remain(b)),(W-320)/2,y,320);y+=345;x.textAlign='center';x.fillStyle='#1c2a2b';x.font=`600 24px ${F}`;
    x.fillText('สแกนจ่ายพร้อมเพย์ '+baht(remain(b))+' บาท',W/2,y);x.font=`400 20px ${F}`;x.fillStyle='#5d6b6c';x.fillText('พร้อมเพย์: '+s.promptpay+(s.payChannels?'  ·  หรือ '+s.payChannels:''),W/2,y+30);x.textAlign='left';y+=55}
  if(!showQR&&!b.paid&&s.payChannels){x.textAlign='center';x.fillStyle='#1c2a2b';x.font=`500 22px ${F}`;x.fillText('ช่องทางชำระ: '+s.payChannels,W/2,y+10);if(s.bankInfo){x.font=`400 20px ${F}`;x.fillText('โอนเข้า: '+s.bankInfo,W/2,y+40)}x.textAlign='left';y+=s.bankInfo?70:40}
  if(b.paid){x.fillStyle='#e7f5ec';x.fillRect(56,y,W-112,70);x.fillStyle='#15803d';x.font=`700 28px ${F}`;x.textAlign='center';x.fillText('✓ ชำระแล้ว '+fmtDate(b.paidDate)+(methodsOf(b)?' ('+methodsOf(b)+')':''),W/2,y+46);x.textAlign='left'}
  else{x.fillStyle='#fff4dc';x.fillRect(56,y,W-112,70);x.fillStyle='#8a4b00';x.font=`700 26px ${F}`;x.textAlign='center';x.fillText('กรุณาชำระภายในวันที่ '+dueText(k),W/2,y+45);x.textAlign='left'}
  y+=100;x.fillStyle='#5d6b6c';x.font=`400 18px ${F}`;x.textAlign='center';x.fillText((s.phone?'ติดต่อ '+s.phone+' · ':'')+(s.note||''),W/2,Math.min(y,H-40));x.textAlign='left';
  return c;
}
async function billImage(k,id){
  try{await document.fonts.ready}catch(e){}
  const b=S.bills[k][id],c=makeBillCanvas(k,id),url=c.toDataURL('image/png'),name=`บิล-ห้อง${b.no}-${k}.png`;
  try{const blob=await new Promise(r=>c.toBlob(r,'image/png'));const f=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:`บิลห้อง ${b.no} ${monthLabel(k)} รวม ${baht(b.total)} บาท`});toast('ส่งแล้ว');return}}catch(e){if(e&&e.name==='AbortError')return}
  sheet(`<div class="sh-h"><div class="h">🖼️ รูปบิลห้อง ${esc(b.no)}</div><button class="x" onclick="openBill('${k}','${id}')">✕</button></div>
  <div class="hint sm"><b>กดค้างที่รูป → บันทึกรูป</b> หรือ แคปหน้าจอ แล้วส่งรูปเข้าแชท LINE ผู้เช่า · ผู้เช่าเปิดแอปธนาคาร เลือก "สแกน" → "เลือกรูปจากอัลบั้ม" จ่ายได้ทันที</div>
  <img src="${url}" alt="รูปบิล" style="width:100%;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.15)">
  <a class="btn line block" href="${lineUrl(billText(k,id))}" target="_blank" rel="noopener">💬 ส่งข้อความบิลประกอบ</a>`)}

function renderPayPage(d){
  document.body.innerHTML='';document.body.style.padding='0';
  let qr='';try{const q=qrModules(ppPayload(d.p,d.a));qr=q.createSvgTag(6,2)}catch(e){qr='<div class="hint">โหลด QR ไม่สำเร็จ</div>'}
  const m=document.createElement('main');m.style.maxWidth='460px';
  m.innerHTML=`<div class="card" style="text-align:center;margin-top:20px"><div class="mut sm">ใบแจ้งค่าเช่า</div><div class="dorm" style="font-size:22px">${esc(d.n)}</div>
  <div class="h" style="margin-top:6px">ห้อง ${esc(d.r)} · ${esc(d.m)}</div><div class="mut">${esc(d.t||'')}</div>
  <div style="font-size:34px;font-weight:700;color:var(--pri);margin:10px 0">${baht(d.a)} บาท</div>
  <div class="qr" style="border:0;box-shadow:none">${qr}</div>
  <div class="sm">พร้อมเพย์: <b>${esc(d.p)}</b></div>
  <div class="hint sm" style="margin-top:12px">📅 กรุณาชำระภายในวันที่ <b>${esc(d.d)}</b></div>
  <div class="sm mut" style="text-align:left;margin-top:10px">วิธีจ่าย: แคปหน้าจอนี้ → เปิดแอปธนาคาร → สแกน → เลือกรูปจากอัลบั้ม<br>หรือเปิดหน้านี้ในอีกเครื่องแล้วสแกน${d.ph?`<br>สอบถาม: ${esc(d.ph)}`:''}</div></div>`;
  m.innerHTML=plain(m.innerHTML);document.body.appendChild(m)}

const SITE_URL='https://platikarn-collab.github.io/joe/dorm/';
function shareText(){return `🏠 JOE หอพัก โปรแกรมหอพักฟรี! จดมิเตอร์ ออกบิล ส่ง LINE พร้อม QR พร้อมเพย์ ใช้ได้ทั้งมือถือและคอม ฟีเจอร์พื้นฐานใช้ฟรีตลอด\n👉 ${SITE_URL}`}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstall()});
function showInstall(){const b=document.getElementById('installBox');if(!b||!deferredInstall)return;
  b.innerHTML=`<div class="banner">📲 <b>ติดตั้งเป็นแอปบนมือถือ</b> เปิดได้จากหน้าจอโดยตรง ใช้ได้แม้ไม่มีเน็ต<button class="btn pri block" onclick="doInstall()">ติดตั้งแอป</button></div>`}
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;document.getElementById('installBox').innerHTML=''}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
(function(){let p=null;try{p=new URLSearchParams(location.search).get('pay')}catch(e){}
  if(p){try{renderPayPage(b64d(p))}catch(e){document.body.innerHTML='<main><div class="card empty">ลิงก์ไม่ถูกต้อง</div></main>'}return}
  load();buildMonths();go('home');})();
</script>
